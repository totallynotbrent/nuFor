name: ci

on:
  push:
    branches: [main, experimental]
  pull_request:

jobs:
  # Bootstrap skeleton checks. Runs on Linux and Windows; real build/verify
  # jobs are added as the mixed Rust/Fortran build system lands (PLAN step 2).
  structure:
    name: structure-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake libhdf5-dev python3-numpy
          rustup component add rustfmt clippy
      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y mingw cmake hdf5
          gfortran --version
          cmake --version
      - name: Verify Rust toolchain
        shell: bash
        run: |
          cargo --version
          rustc --version
      - name: Skeleton structure + LF check
        shell: bash
        run: python .github/scripts/skeleton_check.py
      - name: Campaign gates (dissociation, stagnation, wall accommodation, nozzle, station)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/case_gates.sh
      - name: Repo hygiene (private paths + published paths)
        shell: bash
        run: python tools/repo_hygiene.py

  # the engine wall bracket ships its raw campaign and the judgement made
  # from it. the job re-judges the committed record and compares the
  # artefact, so a number on the page cannot drift away from the evidence
  # underneath it. the judgement runs on the python standard library
  # alone, and it solves its own least squares in plain python, so the
  # verdict does not move with whichever maths library the runner
  # happens to ship.
  bracket-evidence:
    name: engine wall bracket evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-judge the committed record and compare the artefact
        shell: bash
        run: python3 cases/engine-wall-bracket/verify_committed_gate.py
      - name: Re-run the settlement studies and compare them
        shell: bash
        run: python3 cases/engine-wall-bracket/verify_committed_studies.py
      - name: Republish the pages and check them against the committed artefacts
        shell: bash
        run: |
          python3 cases/engine-wall-bracket/publish_bracket_results.py \
            docs/numerics/2d/engine-wall-bracket.md
          python3 cases/engine-wall-bracket/publish_bracket_results.py \
            docs/numerics/2d/conjugate-engine-walls.md
          python3 cases/engine-wall-bracket/publish_settlement_tables.py \
            docs/numerics/2d/engine-wall-bracket.md \
            --power=cases/engine-wall-bracket/studies/power.json \
            --search=cases/engine-wall-bracket/studies/search.json \
            --calibration=cases/engine-wall-bracket/studies/calibration.json
          if ! git diff --quiet -- docs/numerics/2d; then
            echo "::error::the published pages disagree with the committed artefacts"
            git diff --stat -- docs/numerics/2d
            git diff -- docs/numerics/2d
            exit 1
          fi

  # Real mixed build: build.rs drives CMake into the Fortran kernels, then the
  # FFI integration tests run against the linked library (PLAN step 2).
  native:
    name: native build + FFI test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake libhdf5-dev libopenmpi-dev openmpi-bin
          rustup component add rustfmt clippy
      - name: Lint + format
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Build + FFI integration tests
        shell: bash
        run: cargo test --workspace
      - name: MPI parity smoke (np=1 + np=2)
        shell: bash
        run: |
          bin=$(ls -t target/debug/deps/mpi_parity-* | grep -v '\.d$' | head -1)
          # one gate invocation: run under mpirun, retry up to 3 times when
          # the prte teardown race swallows the harness output. mpirun's own
          # exit code is launcher noise (one rank's finalize races the other).
          # the pass signal is the harness's counts, not its prefix: when the
          # race interleaves the captured output with the summary, the
          # "test result: " prefix lands on the captured output's last line
          # and the counts move to the next one.
          check() {
            local np="$1" test="$2" log ok worst attempt
            for attempt in 1 2 3; do
              log=$(mpirun --allow-run-as-root --oversubscribe -np "$np" "$bin" --exact "$test" --nocapture --ignored 2>&1) || true
              echo "$log"
              ok=$(echo "$log" | grep -c '1 passed; 0 failed')
              if [ "$ok" -ge 1 ]; then break; fi
              echo "attempt $attempt for np=$np $test lost the harness output, retrying"
            done
            # the euler gates (sod, uniform) hold exact-zero parity; the
            # viscous and sa gates assert their own roundoff tolerance
            # inside the test, so ok=1 is the pass signal for them.
            if [ "$test" = "mpi_np1_matches_rust_sod2d" ] || [ "$test" = "mpi_np1_matches_rust_uniform_eqair" ]; then
              worst=$(echo "$log" | grep -c 'rel diff (rho): 0.000e0')
              if [ "$ok" -lt 1 ] || [ "$worst" -lt 1 ]; then
                echo "::error::np=$np $test failed (ok=$ok worst=$worst)"
                exit 1
              fi
            else
              if [ "$ok" -lt 1 ]; then
                echo "::error::np=$np $test failed (ok=$ok)"
                exit 1
              fi
            fi
          }
          check 1 mpi_np1_matches_rust_sod2d
          check 2 mpi_np1_matches_rust_sod2d
          check 1 mpi_np1_matches_rust_uniform_eqair
          check 2 mpi_np1_matches_rust_uniform_eqair
          # the laminar viscous march: fortran vs the rust viscous twin,
          # exact on the body-free class (sutherland + cea closure T)
          check 1 mpi_np1_visc_matches_rust
          check 2 mpi_np1_visc_matches_rust
          # the sa gate asserts its own tolerance inside the test
          check 1 mpi_np1_sa_matches_rust
          check 2 mpi_np1_sa_matches_rust
          # the two-temperature gate holds exact-zero parity on the e_v
          # plane and on the conserved march (it asserts both in the test)
          check 1 mpi_np1_2t_matches_rust
          check 2 mpi_np1_2t_matches_rust
          # the capsule body gate asserts its own 1e-6 tolerance inside
          # the test (roundoff at the wall faces is not exact zero)
          capok=0
          for attempt in 1 2 3; do
            caplog=$(mpirun --allow-run-as-root --oversubscribe -np 1 "$bin" --exact mpi_np1_matches_rust_capsule --nocapture --ignored 2>&1) || true
            echo "$caplog"
            capok=$(echo "$caplog" | grep -c '1 passed; 0 failed')
            if [ "$capok" -ge 1 ]; then break; fi
            echo "attempt $attempt for the capsule gate lost the harness output, retrying"
          done
          if [ "$capok" -lt 1 ]; then
            echo "::error::capsule body parity gate failed"
            exit 1
          fi
      - name: MPI distributed restart gate (np=1 + np=2 + np=3)
        shell: bash
        run: |
          bin=$(ls -t target/debug/deps/mpi_restart-* | grep -v '\.d$' | head -1)
          export NUFOUR_MPI_RESTART_DIR="$RUNNER_TEMP/nufor_mpi_restart_gate"
          mkdir -p "$NUFOUR_MPI_RESTART_DIR"
          for test in mpi_split_restart_reproduces_continuous mpi_split_restart_2t_reproduces_continuous; do
          for np in 1 2 3; do
            log=""
            ok=0
            for attempt in 1 2 3; do
              log=$(mpirun --allow-run-as-root --oversubscribe -np "$np" "$bin" --exact "$test" --nocapture --ignored 2>&1) || true
              echo "$log"
              ok=$(echo "$log" | grep -c '1 passed; 0 failed')
              if [ "$ok" -ge 1 ]; then break; fi
              echo "attempt $attempt for np=$np lost the harness output, retrying"
            done
            if [ "$ok" -lt 1 ]; then
              echo "::error::np=$np $test failed (ok=$ok)"
              exit 1
            fi
          done
          done
