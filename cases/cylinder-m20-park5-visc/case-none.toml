# Park5 chemistry gate: Mach 20 dissociating nitrogen cylinder (Casseau et al.
# 2016, Aerospace 3(4):45 / AIP 1786:050006). 2D planar Euler with
# park5 finite-rate chemistry, pure N2. Inviscid-comparable scalars:
# shock standoff ~0.25 m reacting (0.29 non-reacting), peak shock-layer
# temperature 15-17.3 kK (one-T; Casseau's 2-T published band is
# 13.5-15 kK), drag coefficient ~1.3, N mole fraction 0.1-0.25 in the
# near-wall shock layer.
#
# The wall in the canonical case is isothermal 1000 K with slip/jump
# boundary conditions; the Euler lane here uses the slip wall (wall
# heat flux and wall composition are the Fay-Riddell gate's quantities).
schema_version = 1

[metadata]
name = "cylinder-m20-park5-visc-none"
description = "Mach 20 N2 cylinder, park5 viscous lane, non-catalytic isothermal 1000 K wall: the q_w bracket lower bound"
case_revision = 1

[physics]
equations = "euler_2d"
gamma = 1.4
gas_constant = 296.8
mu = 1.716e-5
pr = 0.71
wall_temperature = 1000.0
eos = "park5"
gas = "n2"
catalytic_wall = "none"

[mesh]
nx = 400
ny = 200
x0 = -1.8
x1 = 5.0
y0 = 0.0
y1 = 3.4
source = "uniform"

[body]
type = "sphere"
r = 1.0
cx = 0.0
cy = 0.0

[initial_condition]
type = "uniform"
rho = 1.363e-5
u = 6047.0
p = 0.89

[boundaries]
left = "supersonic_inflow"
right = "supersonic_outflow"
bottom = "wall"
top = "supersonic_outflow"
[boundaries.inflow_state]
rho = 1.363e-5
u = 6047.0
p = 0.89

[numerics]
flux = "hllc"
reconstruction = "muscl"
cfl = 0.4
threads = 6

[time]
final_time = 0.003
max_steps = 6000

[output]
interval_steps = 1500
formats = ["vtk"]
fields = ["rho", "u", "v", "p", "t"]
