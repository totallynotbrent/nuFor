# the stoichiometric methane parcel at 2000 K, ignited in a rigid vessel.
#
# this is the case the chemistry page quotes: the parcel's settled
# temperature and pressure are checked against cantera's own
# constant-volume reactor for the same mixture.
schema_version = 1
name = "gri30-stoich-ignition"

[parcel]
mechanism = "gri30"
fuel = "CH4"
initial_temperature_k = 2000.0
pressure_pa = 101325.0
final_time_s = 2.0e-3
sample_interval_s = 2.0e-6
max_step_s = 5.0e-7
ignition_threshold_k = 400.0
